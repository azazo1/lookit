interface:
  display_name: "lookit"
  short_description: "图片描述, OCR, 定位, 人工辅助读图, 模型 SVG 还原与像素分析"
  default_prompt: "使用 lookit 查看或还原这张图片, 可调用 lookit glance, ground, detect, trace, crop, extract-fg, html-shot, model-svg, dominant-colors, pixel-diff, ascii 或 human. 如果你是视觉模型, 或图片已经进入你的上下文, 无需使用此 skill: 再读同一张图通常无法发现更多问题."
